########################################
# Fonts
########################################
font_size 12

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


########################################
# Splits
########################################
# Enable the splits layout
enabled_layouts splits

# Map keys to launch horizontal and vertical splits
map ctrl+shift+e launch --location=vsplit
map ctrl+shift+o launch --location=hsplit

# Directional Window Navigation (Alt + Arrow Keys)
map alt+up    neighboring_window top
map alt+down  neighboring_window bottom
map alt+left  neighboring_window left
map alt+right neighboring_window right


########################################
# Groups
########################################
map super+g launch --allow-remote-control kitty +kitten broadcast


########################################
# Tab bar
########################################
tab_bar_edge   top
tab_bar_style  separator


########################################
# Tab navigation
########################################
map ctrl+page_up    previous_tab
map ctrl+page_down  next_tab


########################################
# Theme
########################################

# BEGIN_KITTY_THEME
# Konsole Breeze Dark.
include current-theme.conf
# END_KITTY_THEME
